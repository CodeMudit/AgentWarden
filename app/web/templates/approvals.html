{% extends "base.html" %}
{% block title %}Approvals · AgentWarden{% endblock %}
{% block page_title %}Approval Queue{% endblock %}
{% block content %}
<div class="flex gap-2 mb-5">
  <a href="/approvals" class="px-3 py-1.5 rounded-lg text-sm font-medium {% if tab != 'escalated' %}bg-brand-50 text-brand-700 dark:bg-brand-600/20{% else %}text-slate-600 hover:bg-slate-100 dark:text-slate-300{% endif %}">Pending ({{ pending_count }})</a>
  <a href="/approvals?tab=escalated" class="px-3 py-1.5 rounded-lg text-sm font-medium {% if tab == 'escalated' %}bg-escalated-muted text-escalated{% else %}text-slate-600 hover:bg-slate-100 dark:text-slate-300{% endif %}">Escalated ({{ escalated_count }})</a>
</div>

<div id="approval-list" hx-get="/partials/approvals-list?tab={{ tab }}" hx-trigger="every 3s" hx-swap="innerHTML">
  {% include "partials/approvals_list.html" %}
</div>
{% endblock %}
